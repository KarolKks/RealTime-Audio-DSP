name: Firmware CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build STM32 firmware
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ARM GNU toolchain and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            ninja-build

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build firmware
        run: cmake --build build --parallel 2

      - name: Upload firmware build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32-firmware
          if-no-files-found: error
          path: |
            build/DSP_Audio_Project
            build/DSP_Audio_Project.bin
            build/DSP_Audio_Project.hex
            build/DSP_Audio_Project.map

  release:
    name: Publish firmware release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download firmware build artifacts
        uses: actions/download-artifact@v4
        with:
          name: stm32-firmware
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/DSP_Audio_Project.bin
            release-assets/DSP_Audio_Project.hex
          fail_on_unmatched_files: true
